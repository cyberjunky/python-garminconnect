name: CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install --group :all

      - name: Lint with ruff
        run: |
          pdm run ruff check .

      - name: Format check with ruff
        run: |
          pdm run ruff format --check .

      - name: Type check with mypy
        run: |
          pdm run mypy garminconnect --ignore-missing-imports

      - name: Test with pytest
        run: |
          pdm run pytest tests/ -v --tb=short --vcr-record=none

      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: |
          pdm run coverage run -m pytest tests/ --vcr-record=none
          pdm run coverage xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install --prod --group security

      - name: Security check with bandit
        run: |
          pdm run bandit -r garminconnect demo.py example.py scripts -ll

      - name: Dependency vulnerability audit
        run: |
          pdm run pip-audit
